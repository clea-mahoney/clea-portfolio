name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html resume.html work-samples.html consulting.html speaking.html ai-experiments.html flowstack-workshop.html styles.css _site/
          cp -R assets _site/
          cp -R call-evidence flowstack-preview _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: pages-${{ github.run_attempt }}
      - name: Wait for the uploaded site to be available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..24}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v5
        with:
          artifact_name: pages-${{ github.run_attempt }}
        id: deployment
