<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workflow canvas</title><style>*{box-sizing:border-box}body{margin:0;color:#102a27;font:1rem/1.5 system-ui,sans-serif}figure{margin:0;border:1px solid #b2c8bf;border-radius:.75rem;overflow:hidden;background:#eff7f3}figcaption{padding:.65rem 1rem;background:#0a5a48;color:white;font-weight:650}ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));padding:1rem;gap:.8rem;margin:0;list-style:none}li{background:white;border:1px solid #b2c8bf;border-radius:.45rem;padding:.85rem;overflow-wrap:anywhere}small,strong,span{display:block}small{color:#405951}strong{margin:.3rem 0}p{margin:.9rem 0 0}a{color:#075847}body[data-figure="platform"] li:first-child{grid-column:1/-1;text-align:center}body[data-figure="platform"] ol{grid-template-columns:1fr 1fr}ol{background-color:#f4f8f6;background-image:radial-gradient(#c0d1cb 1px,transparent 1px);background-size:14px 14px}li{border-top:4px solid #0a5a48}aside{padding:.6rem 1rem;border-bottom:1px solid #b2c8bf;background:#fff;color:#274640}aside b{margin-right:1rem}</style></head><body data-figure="builder"><figure><figcaption>Workflow canvas</figcaption><aside><b>Library</b> Actions · Flow control · My library</aside><ol><li><small>Trigger</small><strong>Form submitted</strong><span>The technician has finished entering the client name.</span></li><li><small>Action</small><strong>Compose greeting</strong><span>Use the name submitted on this run.</span></li><li><small>On success → next action</small><strong>Display message</strong><span>Show the greeting to the technician.</span></li></ol></figure><p>In the next lesson, look inside the message to find out where the name comes from.</p><script>if(window.frameElement){const fit=()=>window.frameElement.parentElement.style.setProperty("--practice-height",Math.ceil(document.body.getBoundingClientRect().height+2)+"px");new ResizeObserver(fit).observe(document.body);fit()}</script></body></html>
