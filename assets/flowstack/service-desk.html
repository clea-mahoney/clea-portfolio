<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow a form value</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#102a27;background:#fff;font:1rem/1.5 system-ui,sans-serif}main{max-width:52rem;margin:auto;border:1px solid #b2c8bf;border-radius:.75rem;overflow:hidden}header{background:#0a5a48;color:white;padding:.75rem 1.25rem;font-weight:650}header span{font-weight:400}section{padding:1rem 1.25rem}h2{font-size:1.32rem;margin:0 0 .4rem}p{margin:0 0 .85rem}form{display:flex;flex-wrap:wrap;align-items:end;gap:.75rem 1rem}label{display:grid;gap:.25rem;font-weight:650}input,button{font:inherit;border-radius:.35rem;min-height:44px;padding:.4rem .7rem}input{background:white;color:#102a27;border:1px solid #687f77}button{background:#0a5a48;color:white;border:1px solid #0a5a48;font-weight:650;cursor:pointer}button:hover{background:#064738}input:focus-visible,button:focus-visible{outline:3px solid #82352a;outline-offset:2px}#log{background:#eff7f3;border-top:1px solid #b2c8bf}ol{margin:.5rem 0;padding-left:1.5rem}li{padding:.2rem 0}#next{margin:.7rem 0 0}footer{font-size:.85rem;color:#425854;margin:.7rem auto;max-width:52rem}

code {overflow-wrap:anywhere} input {max-width:100%;width:16rem} form {align-items:end} form label {max-width:100%}
</style></head><body>
<main><header>Flowstack <span>/ Test form</span></header>
<section><form id="client-form"><label>Client name<input id="client" value="Cedar" required maxlength="60" pattern=".*[^ ].*" autocomplete="off"></label><button>Submit form</button></form></section>
<section id="log" aria-live="polite" aria-atomic="true"><h2>Workflow run</h2><p id="status">Waiting for a form submission.</p>
<div id="trace" hidden><p>Form input<br><code>client_name = <span id="input-value"></span></code></p>
<p>Message template<br><code>Hello, {{ CTX.client_name }}!</code></p>
<p>Message from this run<br><strong id="message"></strong></p></div></section></main>
<footer>Flowstack is fictional. This form runs in your browser.</footer>
<script>
if (window.frameElement) {
  const panel = window.frameElement.parentElement;
  const fitPanel = () => {
    const footer = document.querySelector('footer');
    const height = footer.getBoundingClientRect().bottom + parseFloat(getComputedStyle(footer).marginBottom);
    panel.style.setProperty('--practice-height', Math.ceil(height) + 'px');
  };
  new ResizeObserver(fitPanel).observe(document.body);
  fitPanel();
}
const form = document.querySelector('#client-form');
let runs = 0;
form.addEventListener('submit', event => {
  event.preventDefault();
  const name = document.querySelector('#client').value.trim();
  if (!name) return;
  runs += 1;
  document.querySelector('#status').textContent = 'Run ' + runs + ' started when you submitted the form.';
  document.querySelector('#input-value').textContent = name;
  document.querySelector('#message').textContent = 'Hello, ' + name + '!';
  document.querySelector('#trace').hidden = false;
});
</script></body></html>
