<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form preview</title><style>*{box-sizing:border-box}body{margin:0;color:#102a27;font:1rem/1.5 system-ui,sans-serif}figure{margin:0;border:1px solid #b2c8bf;border-radius:.75rem;overflow:hidden;background:#eff7f3}figcaption{padding:.65rem 1rem;background:#0a5a48;color:white;font-weight:650}ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));padding:1rem;gap:.8rem;margin:0;list-style:none}li{background:white;border:1px solid #b2c8bf;border-radius:.45rem;padding:.85rem;overflow-wrap:anywhere}small,strong,span{display:block}small{color:#405951}strong{margin:.3rem 0}p{margin:.9rem 0 0}a{color:#075847}body[data-figure="platform"] li:first-child{grid-column:1/-1;text-align:center}body[data-figure="platform"] ol{grid-template-columns:1fr 1fr}li:first-child span{border:1px solid #63786f;border-radius:.3rem;padding:.45rem .6rem}li:nth-child(2) strong{font-family:monospace}</style></head><body data-figure="forms"><figure><figcaption>Form preview</figcaption><ol><li><small>Technician view</small><strong>Client name</strong><span>Cedar</span></li><li><small>Workflow input</small><strong>client_name</strong><span>Cedar</span></li></ol></figure><p>A builder can draft form fields with the in-app AI and refine them. Prebuilt workflows can also include a form for their required inputs. Next, try submitting one.</p><script>if(window.frameElement){const fit=()=>window.frameElement.parentElement.style.setProperty("--practice-height",Math.ceil(document.body.getBoundingClientRect().height+2)+"px");new ResizeObserver(fit).observe(document.body);fit()}</script></body></html>
