<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One run, traced</title><style>*{box-sizing:border-box}body{margin:0;color:#102a27;font:1rem/1.5 system-ui,sans-serif}figure{margin:0;border:1px solid #b2c8bf;border-radius:.75rem;overflow:hidden;background:#eff7f3}figcaption{padding:.65rem 1rem;background:#0a5a48;color:white;font-weight:650}ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));padding:1rem;gap:.8rem;margin:0;list-style:none}li{background:white;border:1px solid #b2c8bf;border-radius:.45rem;padding:.85rem;overflow-wrap:anywhere}small,strong,span{display:block}small{color:#405951}strong{margin:.3rem 0}p{margin:.9rem 0 0}a{color:#075847}body[data-figure="platform"] li:first-child{grid-column:1/-1;text-align:center}body[data-figure="platform"] ol{grid-template-columns:1fr 1fr}li strong{font:600 1rem/1.5 ui-monospace,monospace;color:#075847}</style></head><body data-figure="data"><figure><figcaption>One run, traced</figcaption><ol><li><small>Form input</small><strong>client_name</strong><span>Cedar</span></li><li><small>Message template</small><strong>Hello, {{ CTX.client_name }}!</strong><span>Insert the value of client_name from this run.</span></li><li><small>Action result</small><strong>Hello, Cedar!</strong><span>The next action can use this message.</span></li></ol></figure><p>When an action returns several fields, a builder can save its whole result or give just one field an alias. Ask the in-app AI to explain an unfamiliar expression.</p><script>if(window.frameElement){const fit=()=>window.frameElement.parentElement.style.setProperty("--practice-height",Math.ceil(document.body.getBoundingClientRect().height+2)+"px");new ResizeObserver(fit).observe(document.body);fit()}</script></body></html>
